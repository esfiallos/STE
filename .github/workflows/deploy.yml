# Producción: al llegar código a "main" se verifica, se compila contra la base PROD y se publica en Cloudflare
# (worker "panel-noc"). Detalle en docs/ENTORNOS_Y_DESPLIEGUE.md.
name: Desplegar a producción

# APAGADO (27/11/2026): sin publicación automática al hacer push a "main"; solo a mano (Run workflow).
# Con wrangler.jsonc en "workers_dev": false, lanzarlo a mano retira la dirección *.workers.dev.
on:
  workflow_dispatch:

# Un despliegue a la vez; si llega otro mientras corre, espera en lugar de cancelarlo.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    uses: ./.github/workflows/verificar.yml

  publicar:
    needs: verificar
    uses: ./.github/workflows/publicar.yml
    with:
      entorno: production
      app_env: production
      proyecto_supabase: kkslgsgapodpzuifjrwz # STE (PROD)
    secrets: inherit
