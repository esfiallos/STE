# Integración continua: ramas de trabajo y PR a main solo se verifican, nunca se publican.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Con la publicación apagada (deploy*.yml solo a mano), main y desarrollo también se verifican aquí
    branches-ignore: [gh-pages]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    uses: ./.github/workflows/verificar.yml
