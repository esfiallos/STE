# Integración continua: ramas de trabajo y PR a main solo se verifican, nunca se publican.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    # main y desarrollo se verifican en su propio despliegue (deploy.yml, deploy-dev.yml)
    branches-ignore: [main, desarrollo, gh-pages]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    uses: ./.github/workflows/verificar.yml
